name: OpenClaw Persistent Run

on:
  workflow_dispatch:
  push:
    branches:
      - main

# 🔐 Allow push
permissions:
  contents: write

jobs:
  openclaw-run:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    concurrency:
      group: openclaw-run
      cancel-in-progress: true

    steps:
      # 📥 Checkout PUBLIC repo (this repo) – needed only to access workflow files if any.
      - name: Checkout public repo
        uses: actions/checkout@v4

      # 🔑 Clone PRIVATE repo (state storage)
      - name: Clone private sync repo
        run: |
          git clone https://${{ secrets.PAT_TOKEN }}@github.com/spoodiman01/opensync.git openclaw_sync || mkdir openclaw_sync

      # 🟢 Node setup
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      # 📦 Install deps
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl git rsync jq

      # ⚙️ Install OpenClaw
      - name: Install OpenClaw
        run: |
          npm install -g openclaw@2026.4.22
          openclaw --version

      # ❌ Disable problematic plugin
      - name: Disable problematic plugin
        run: |
          openclaw plugins disable acpx || true
          openclaw plugins uninstall acpx || true

      # 📂 Restore state (now reads from repo root)
      - name: Restore OpenClaw State
        run: |
          mkdir -p ~/.openclaw
          cd openclaw_sync

          for dir in workspace memory credentials; do
            if [ -d "$dir" ]; then
              cp -a "$dir" ~/.openclaw/
            fi
          done

          [ -f "openclaw.json" ] && cp openclaw.json ~/.openclaw/
          [ -f ".env" ] && cp .env ~/.openclaw/

          echo "✅ State restored"

      # 🔐 Auth setup
      - name: Configure OpenClaw Google auth
        run: |
          mkdir -p ~/.openclaw/agents/main/agent

          set -a
          [ -f ~/.openclaw/.env ] && . ~/.openclaw/.env
          set +a

          KEY="${GOOGLE_API_KEY:-${GEMINI_API_KEYS%%,*}}"

          if [ -z "$KEY" ]; then
            echo "❌ Missing API key"
            exit 1
          fi

          cat > ~/.openclaw/agents/main/agent/auth-profiles.json <<EOF
          {
            "version": 1,
            "profiles": {
              "google:default": {
                "type": "api_key",
                "provider": "google",
                "key": "$KEY"
              }
            }
          }
          EOF

      # 🚀 Run OpenClaw
      - name: Run OpenClaw Gateway
        run: |
          openclaw gateway install
          openclaw gateway run &
          sleep 25

          echo "🚀 OpenClaw running..."
          ps aux | grep openclaw || true

          END=$((SECONDS+19800))
          while [ $SECONDS -lt $END ]; do
            echo "⏳ Alive: $SECONDS sec"
            sleep 60
          done

          openclaw gateway stop || true

      # 📜 Logs
      - name: Show logs
        run: |
          echo "---- LOG OUTPUT ----"
          find ~/.openclaw -name "*.log" -exec tail -n 50 {} \; || true

      # 💾 Save state → PRIVATE repo (repo root)
      # 💾 Save state → PRIVATE repo (repo root)
      - name: Save and push state
        run: |
          cd openclaw_sync
          
          # 1. Initialize if clone failed or repo is empty
          if [ ! -d ".git" ]; then
            git init
            git remote add origin https://${{ secrets.PAT_TOKEN }}@github.com/spoodiman01/opensync.git
          fi

          git config user.email "${{ secrets.GITHUBMAIL }}"
          git config user.name "${{ secrets.GITHUBNAME }}"

          mkdir -p workspace memory credentials
          rsync -av --exclude='venv' --exclude='node_modules' ~/.openclaw/workspace/ workspace/ || true
          cp ~/.openclaw/openclaw.json . 2>/dev/null || true
          cp ~/.openclaw/.env . 2>/dev/null || true
          cp -r ~/.openclaw/memory/* memory/ 2>/dev/null || true
          cp -r ~/.openclaw/credentials/* credentials/ 2>/dev/null || true

          git add .

          # 2. Only commit and push if there are actual changes
          if ! git diff --cached --quiet; then
            git commit -m "Update OpenClaw state $(date)"
            
            # 3. Pull first to handle the [rejected] error
            # We use -X theirs to prioritize your new state in case of conflicts
            git pull --rebase -X theirs origin main
            
            git push origin HEAD:main
          else
            echo "No changes to save."
          fi

      # 🟢 Keep PUBLIC repo alive (clean clone push to trigger new run)
      - name: Keepalive commit (clean clone)
        run: |
          git clone https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git keepalive_temp
          cd keepalive_temp
          git config user.email "${{ secrets.GITHUBMAIL }}"
          git config user.name "${{ secrets.GITHUBNAME }}"
          git commit --allow-empty -m "Keepalive: $(date)"
          git push origin HEAD:main
