name: OpenClaw Persistent Run

on:
  workflow_dispatch:
  push:
    branches:
      - main
#  schedule:
 #   - cron: "0 */5 * * *"   # every 5 hours

# 🔐 IMPORTANT: allow push
permissions:
  contents: write

jobs:
  openclaw-run:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    concurrency:
      group: openclaw-run
      cancel-in-progress: true

    steps:
      # 📥 Checkout PUBLIC repo (this repo)
      - name: Checkout public repo
        uses: actions/checkout@v4

      # 🔑 Clone PRIVATE repo (state storage)
      - name: Clone private sync repo
        run: |
          git clone https://${{ secrets.PAT_TOKEN }}@github.com/spoodiman01/opensync.git openclaw_sync || mkdir openclaw_sync

      # 🟢 Node setup
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      # 📦 Install deps
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl git rsync jq

      # ⚙️ Install OpenClaw
      - name: Install OpenClaw
        run: |
          npm install -g openclaw@2026.4.22
          openclaw --version

      # ❌ Disable problematic plugin
      - name: Disable problematic plugin
        run: |
          openclaw plugins disable acpx || true
          openclaw plugins uninstall acpx || true

      # 📂 Restore state
      - name: Restore OpenClaw State
        run: |
          mkdir -p ~/.openclaw

          BASE="openclaw_sync/openclaw_sync"

          [ -d "$BASE/workspace" ] && cp -a "$BASE/workspace" ~/.openclaw/
          [ -f "$BASE/openclaw.json" ] && cp "$BASE/openclaw.json" ~/.openclaw/
          [ -f "$BASE/.env" ] && cp "$BASE/.env" ~/.openclaw/

          [ -d "$BASE/memory" ] && cp -a "$BASE/memory" ~/.openclaw/
          [ -d "$BASE/credentials" ] && cp -a "$BASE/credentials" ~/.openclaw/

          echo "✅ State restored"

      # 🔐 Auth setup
      - name: Configure OpenClaw Google auth
        run: |
          mkdir -p ~/.openclaw/agents/main/agent

          set -a
          [ -f ~/.openclaw/.env ] && . ~/.openclaw/.env
          set +a

          KEY="${GOOGLE_API_KEY:-${GEMINI_API_KEYS%%,*}}"

          if [ -z "$KEY" ]; then
            echo "❌ Missing API key"
            exit 1
          fi

          cat > ~/.openclaw/agents/main/agent/auth-profiles.json <<EOF
          {
            "version": 1,
            "profiles": {
              "google:default": {
                "type": "api_key",
                "provider": "google",
                "key": "$KEY"
              }
            }
          }
          EOF

      # 🚀 Run OpenClaw
      - name: Run OpenClaw Gateway
        run: |
          openclaw gateway install
          openclaw gateway run &
          sleep 25

          echo "🚀 OpenClaw running..."
          ps aux | grep openclaw || true

          END=$((SECONDS+17700))

          while [ $SECONDS -lt $END ]; do
            echo "⏳ Alive: $SECONDS sec"
            sleep 60
          done

          openclaw gateway stop || true

      # 📜 Logs
      - name: Show logs
        run: |
          echo "---- LOG OUTPUT ----"
          find ~/.openclaw -name "*.log" -exec tail -n 50 {} \; || true

      # 💾 Save state → PRIVATE repo
      - name: Save and push state
        run: |
          cd openclaw_sync

          git config user.email "${{ secrets.GITHUBMAIL }}"
          git config user.name "${{ secrets.GITHUBNAME }}"

          mkdir -p workspace memory credentials

          rsync -av --exclude='venv' --exclude='node_modules' ~/.openclaw/workspace/ workspace/ || true
          cp ~/.openclaw/openclaw.json . 2>/dev/null || true
          cp ~/.openclaw/.env . 2>/dev/null || true
          cp -r ~/.openclaw/memory/* memory/ 2>/dev/null || true
          cp -r ~/.openclaw/credentials/* credentials/ 2>/dev/null || true

          git add .

          # commit only if changes exist
          git diff --cached --quiet || git commit -m "Update OpenClaw state $(date)"

          git push https://${{ secrets.PAT_TOKEN }}@github.com/spoodiman01/opensync.git HEAD:main

      # 🟢 Keep PUBLIC repo alive
      - name: Keepalive commit
        run: |
          git config user.email "${{ secrets.GITHUBMAIL }}"
          git config user.name "${{ secrets.GITHUBNAME }}"

          git commit --allow-empty -m "Keepalive: $(date)"

          git push https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
